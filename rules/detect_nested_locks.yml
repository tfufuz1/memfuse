id: detect-nested-locks
language: rust
rule:
  all:
    - pattern: $LOCK1.lock().await
    - inside:
        kind: "{}"
        has:
          pattern: $LOCK2.lock().await
message: "Graceful Deadlock risk: Multiple lock().await invocations detected within the same block scope. Ensure lock hierarchies are strictly enforced."
severity: error
