risk = "none"

[crate_overrides.memfuse-text]
tier = "2"
risk = "utf8"

[crate_overrides.memfuse-checkpoint]
tier = "2"
risk = "none"

[crate_overrides.memfuse-db]
tier = "1"
risk = "fusion"

[crate_overrides.memfuse-embed]
tier = "3"
risk = "gate"

[crate_overrides.memfuse-ollama]
tier = "3"
risk = "inj"

[crate_overrides.memfuse-agent]
tier = "2"
risk = "budget"

[crate_overrides.memfuse-py]
