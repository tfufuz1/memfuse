# Deterministische Fehler-Matrix für MemFuse (Structured Process Orchestration)
# Definiert die Fehlerklassifikation, automatische Agenten-Reaktionen und Status-Codes.

version: "2026.1"
matrix_name: "MemFuse Deterministic Error Matrix"

error_classes:
  # Klasse 1: Transiente Fehler — temporal, automatisch behebbar
  - class: TRANSIENT
    description: "Temporäre Ressourcenengpässe, Timeouts oder Lock-Konflikte."
    http_status: [429, 503, 504]
    agent_action: RETRY_EXPONENTIAL_BACKOFF
    params:
      max_attempts: 3
      base_ms: 500
      multiplier: 2
      # Sequenz: 500ms → 1000ms → 2000ms
    on_exhaustion: ESCALATE_TO_ORCHESTRATOR
    memfuse_error_kinds:
      - "TransactionTimeout"
      - "SandboxTimeout"
      - "Conflict"

  # Klasse 2: Logische Fehler — Spec-Verletzung, falscher Input, Strategiemutation nötig
  - class: LOGICAL
    description: "Ungültige Parameter, Dimensionskonflikte oder nicht gefundene Entitäten."
    http_status: [400, 404, 422]
    agent_action: ABORT_CURRENT_APPROACH
    params:
      mutation_required: true
      reload_spec: true
    on_exhaustion: ESCALATE_TO_HUMAN_GATE
    memfuse_error_kinds:
      - "InvalidInput"
      - "NotFound"
      - "EmbeddingDimensionMismatch"
      - "ParseError"
      - "CapabilityUnsupported"
      - "StaleRead"

  # Klasse 3: Fatale Fehler — unkontrollierte Beschädigung, sofortiger Abbruch
  - class: FATAL
    description: "Physische Dateisystemfehler, Prüfsummenfehler oder WAL-Korruption."
    http_status: [500]
    agent_action: ABORT_AND_ESCALATE
    params:
      create_incident: true
      rollback_state: true
    on_trigger: IMMEDIATE_ESCALATION
    memfuse_error_kinds:
      - "WalCorruption"
      - "ChecksumMismatch"
      - "Storage"
      - "Io"
      - "Crypto"
      - "Serialization"
      - "Bincode"
      - "Json"
      - "Internal"

  # Klasse 4: Invarianten- / Governance-Verletzung — Sicherheits- und Architekturalarm
  - class: ARCHITECTURAL
    description: "Verletzung von System-Invarianten, Budget-Überschreitung oder Policy-Verletzung."
    http_status: [403, 409, 507]
    agent_action: HALT_ALL_DEPENDENT_AGENTS
    params:
      notify: ["ORCHESTRATOR", "HUMAN_GATE"]
      quarantine_output: true
    memfuse_error_kinds:
      - "PolicyViolation"
      - "MemoryBudgetExceeded"
      - "MemoryLimitExceeded"
      - "HnswConnectivityDegraded"
      - "InvalidSequenceNumber"
      - "CheckpointNotFound"
