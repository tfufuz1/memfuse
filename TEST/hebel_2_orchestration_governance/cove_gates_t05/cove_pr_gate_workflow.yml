name: MemFuse SPO CoVe PR Verification Gate

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  cove_verification_gate:
    name: "T-05: CoVe 4-Phase Verification Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: "Phase 1: Code Formatting & Type Check"
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets

      - name: "Phase 2: Architectural Drift & Collision Detection"
        run: |
          echo "=== Checking for Symbol Collisions & Architectural Drift ==="
          # Example: Prevent CompactionStrategy collision between LLM Context Compactor and LSM Storage
          CONFLICTS=$(grep -rn "enum CompactionStrategy" crates/ || true)
          echo "$CONFLICTS"
          COUNT=$(echo "$CONFLICTS" | grep -v "^$" | wc -l)
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Architectural collision detected! CompactionStrategy defined in multiple places. Rename LSM vs ContextCompaction variants!"
            exit 1
          fi

      - name: "Phase 3: Anti-Panic & Unwrap Audit"
        run: |
          echo "=== Scanning for unapproved unwrap() calls in production crates ==="
          # memfuse-core must be unwrap-free in production paths
          UNWRAPS=$(grep -rn "\.unwrap()" crates/memfuse-core/src/ || true)
          if [ -n "$UNWRAPS" ]; then
            echo "::warning::Unwraps detected in memfuse-core! Check invariants."
          fi

      - name: "Phase 4: Run Tests with Zero Regression Tolerance"
        run: |
          cargo test --workspace --all-targets -- --nocapture

      - name: "Phase 4 Verdict: Emit CoVe Verification Envelope"
        if: always()
        run: |
          echo "CoVe PR Gate finished with status: ${{ job.status }}"
