name: Jules Auto-Merge Workflow
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  jules-gatekeeper:
    runs-on: ubuntu-latest
    # Trigger für alle Accounts (01-13) oder das Label 'jules'
    if: |
      contains(github.event.pull_request.labels.*.name, 'jules') ||
      startsWith(github.event.pull_request.user.login, 'jules-') ||
      contains(github.event.pull_request.title, '@JULES-')
    
    steps:
      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Jules contribution detected. Enabling auto-merge..."
          gh pr merge --auto --merge --delete-branch "$PR_URL"
