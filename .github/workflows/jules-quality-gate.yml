name: Jules Quality Gate
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality-gate:
    name: Quality Gate (fmt + clippy + test)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: cargo fmt --all -- --check

      - name: Clippy (warnings = errors)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Build check
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: cargo check --all-targets --workspace

      - name: Run tests (pass 1/3)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: cargo test --workspace 2>&1 | tee test-run-1.txt

      - name: Run tests (pass 2/3)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: cargo test --workspace 2>&1 | tee test-run-2.txt

      - name: Run tests (pass 3/3)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: cargo test --workspace 2>&1 | tee test-run-3.txt

      - name: Verify triple-pass consistency
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          echo "=== Verifying all 3 test runs are green ==="
          for f in test-run-1.txt test-run-2.txt test-run-3.txt; do
            if grep -q "FAILED" "$f"; then
              echo "❌ TRIPLE-TEST FAILED in $f"
              cat "$f"
              exit 1
            fi
          done
          echo "✅ Triple-Test Gate passed (3/3 runs green)"

      - name: Upload test artifacts
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triple-test-results
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          path: test-run-*.txt

  dependency-audit:
    name: Dependency Security Audit
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: cargo install cargo-audit --locked

      - name: Security audit
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: cargo audit

      - name: Check for unused dependencies
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          # Warn on unused deps (non-blocking for now)
          cargo install cargo-machete --locked 2>/dev/null || true
          cargo machete 2>/dev/null || echo "⚠️ cargo-machete not available, skipping"

  unwrap-guard:
    name: Zero-unwrap Guard
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for .unwrap() in production code
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          echo "=== Scanning for .unwrap() usage ==="
          # Allow unwrap only in test code (#[test] / #[cfg(test)])
          VIOLATIONS=$(grep -rn "\.unwrap()" --include="*.rs" crates/ \
            | grep -v "#\[test\]" \
            | grep -v "#\[cfg(test)\]" \
            | grep -v "//.*unwrap" \
            | grep -v "_test\." \
            | grep -v "/tests/" \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ ZERO-UNWRAP VIOLATION:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ No .unwrap() violations found"

      - name: Scan for unsafe code outside distance.rs
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          echo "=== Scanning for unsafe code ==="
          VIOLATIONS=$(grep -rnE "unsafe (fn|block|impl|trait)" --include="*.rs" crates/ \
            | grep -v "crates/memfuse-index/src/distance.rs" \
            | grep -v "#\[allow(unsafe_code)\]" \
            | grep -v "//.*unsafe" \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ UNSAFE CODE VIOLATION:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ No unsafe code violations found"

      - name: AST-Grep Lock-Graph Analyzer
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          npm install -g @ast-grep/cli
          echo "=== Scanning for Graceful Deadlocks ==="
          if sg scan --rule rules/detect_nested_locks.yml crates/; then
             echo "❌ GRACEFUL DEADLOCK DETECTED"
             exit 1
          fi
          echo "✅ AST-Grep Deadlock Scan passed"
