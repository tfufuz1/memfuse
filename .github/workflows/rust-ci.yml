name: Rust CI
on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --workspace --exclude memfuse-tauri -- -D warnings

  feature-matrix:
    name: Feature Matrix Checks (memfuse-embed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check memfuse-embed --no-default-features
        run: cargo check -p memfuse-embed --no-default-features
      - name: Check memfuse-embed --all-features
        run: cargo check -p memfuse-embed --all-features

  test:
    name: Test Suite (Triple-Run Flaky-Detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run 1
        run: cargo test --workspace --exclude memfuse-tauri
      - name: Run 2 (Flaky-Check)
        run: cargo test --workspace --exclude memfuse-tauri
      - name: Run 3 (Flaky-Check Final)
        run: cargo test --workspace --exclude memfuse-tauri

  # KONSOLIDIERUNGS-HINWEIS: Der redundante context-gates Job wurde hier entfernt.
  # Die Kanonische Quelle für Context Integrity Gates ist .github/workflows/context-gates.yml,
  # welcher als dedizierter Workflow parallel auf push/pull_request läuft.
