# Tiefenprüfung = nicht-blockierend
# Dieses Workflow-File fuehrt umfassende Tiefenpruefungen aus (Coverage, Integrationstests, Feature-Matrix, Cross-Platform, Binding-Checks).
# Alle Jobs sind mit continue-on-error: true versehen, sodass sie nicht mehr merge-blockierend sind, aber weiterhin ausgefuehrt werden und Ergebnisse liefern.

name: Rust CI (Tiefenprüfung)
on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  compile-check:
    name: Compile Check (cargo check)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Workspace Compile Gate
        run: cargo run -p xtask -- check-compile

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run rustfmt check
        run: cargo fmt --all -- --check || (echo "❌ Format Check fehlgeschlagen! Lokal beheben mit: cargo fmt --all && git commit --amend --no-edit" && exit 1)

  supply-chain:
    name: Dependency Security & License Audit
    runs-on: ubuntu-latest
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  coverage:
    name: Line Coverage Gate (>= 50%)
    runs-on: ubuntu-latest
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage & enforce threshold
        run: cargo llvm-cov --workspace --locked --exclude memfuse-tauri --fail-under-lines 50
      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/llvm-cov/html

  per-crate-coverage-report:
    name: Per-Crate Coverage Report (Non-blocking)
    runs-on: ubuntu-latest
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate Per-Crate Coverage Summary
        run: |
          echo "## Per-Crate Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Crate | Line Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY

          for crate in memfuse-store memfuse-candle memfuse-db memfuse-index; do
            COV_OUTPUT=$(cargo llvm-cov -p "$crate" --locked 2>&1)
            # Parse line coverage percentage from the TOTAL line
            PCT=$(echo "$COV_OUTPUT" | grep -E "^TOTAL" | awk '{print $(NF)}')
            if [ -z "$PCT" ]; then
              PCT="N/A"
            fi
            echo "| \`$crate\` | $PCT |" >> $GITHUB_STEP_SUMMARY
          done

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check for duplicate symbols (fast pre-build gate)
        run: cargo run -p xtask -- check-duplicate-symbols
      - run: cargo clippy --locked --all-targets --workspace --exclude memfuse-tauri -- -D warnings

  feature-matrix:
    name: Feature Matrix Checks
    runs-on: ubuntu-latest
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check memfuse-embed --no-default-features
        run: cargo check --locked -p memfuse-embed --no-default-features
      - name: Check memfuse-embed --all-features
        run: cargo check --locked -p memfuse-embed --all-features
      - name: Check memfuse-db --features reranking
        run: cargo check --locked -p memfuse-db --features reranking

  maturin-dry-run:
    name: PyPI Wheel Build Check (Maturin Dry-Run)
    runs-on: ubuntu-latest
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install maturin
        run: pip install maturin
      - name: Dry-run maturin build
        run: maturin build --manifest-path crates/memfuse-py/Cargo.toml

  test:
    name: Test Suite (cargo-nextest with retries)
    runs-on: ubuntu-latest
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Run Tests with Nextest Retries
        run: cargo nextest run --locked --workspace --exclude memfuse-tauri --retries 2 --no-fail-fast
      - name: Report flaky tests (tests that needed a retry)
        if: always()
        run: |
          if [ -f target/nextest/default/*.xml ]; then
            RETRY_COUNT=$(grep -o 'flaky="true"' target/nextest/default/*.xml 2>/dev/null | wc -l | tr -d ' ')
            if [ "$RETRY_COUNT" -gt 0 ]; then
              echo "::warning::${RETRY_COUNT} flaky Test(s) erkannt — moegliche Race Conditions, siehe TESTING.md Abschnitt 2.6 (Concurrency)"
            fi
          fi
      - name: Run Doc Tests
        run: cargo test --doc --locked --workspace --exclude memfuse-tauri

  clippy-py:
    name: Clippy (memfuse-py)
    runs-on: ubuntu-latest
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --manifest-path crates/memfuse-py/Cargo.toml --all-targets -- -D warnings

  test-py:
    name: Test Suite (memfuse-py)
    runs-on: ubuntu-latest
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --manifest-path crates/memfuse-py/Cargo.toml

  lockfile-check-py:
    name: Check memfuse-py Lockfile in sync
    runs-on: ubuntu-latest
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check memfuse-py Lockfile in sync
        run: |
          cd crates/memfuse-py
          cargo update --dry-run --locked 2>&1 | grep "^Updating" && \
            echo "::error::memfuse-py Cargo.lock is out of sync!" && exit 1 || true

  clippy-tauri-lib:
    name: Clippy (memfuse-tauri --lib)
    runs-on: ubuntu-latest
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p memfuse-tauri --lib -- -D warnings

  test-tauri:
    name: Test Suite (memfuse-tauri --lib)
    runs-on: ubuntu-latest
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p memfuse-tauri --lib

  test-cross-platform:
    name: Cross-Platform Core Tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test core storage/crypto crates
        run: cargo test --locked -p memfuse-core -p memfuse-store -p memfuse-crypto -p memfuse-index -p memfuse-text -p memfuse-graph -p memfuse-checkpoint -p memfuse-db

  # KONSOLIDIERUNGS-HINWEIS: Der redundante context-gates Job wurde hier entfernt.
  # Die Kanonische Quelle für Context Integrity Gates ist .github/workflows/context-gates.yml,
  # welcher als dedizierter Workflow parallel auf push/pull_request läuft.
