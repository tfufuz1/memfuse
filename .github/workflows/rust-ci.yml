name: Rust CI
on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run rustfmt check
        run: cargo fmt --all -- --check || (echo "❌ Format Check fehlgeschlagen! Lokal beheben mit: cargo fmt --all && git commit --amend --no-edit" && exit 1)

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --workspace --exclude memfuse-tauri -- -D warnings

  feature-matrix:
    name: Feature Matrix Checks (memfuse-embed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check memfuse-embed --no-default-features
        run: cargo check --locked -p memfuse-embed --no-default-features
      - name: Check memfuse-embed --all-features
        run: cargo check --locked -p memfuse-embed --all-features

  test:
    name: Test Suite (Triple-Run Flaky-Detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run 1
        run: cargo test --locked --workspace --exclude memfuse-tauri
      - name: Run 2 (Flaky-Check)
        run: cargo test --locked --workspace --exclude memfuse-tauri
      - name: Run 3 (Flaky-Check Final)
        run: cargo test --locked --workspace --exclude memfuse-tauri

  clippy-tauri-lib:
    name: Clippy (memfuse-tauri --lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p memfuse-tauri --lib -- -D warnings

  test-tauri:
    name: Test Suite (memfuse-tauri --lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p memfuse-tauri --lib

  test-cross-platform:
    name: Cross-Platform Core Tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test core storage/crypto crates
        run: cargo test --locked -p memfuse-core -p memfuse-store -p memfuse-crypto -p memfuse-index -p memfuse-text -p memfuse-graph -p memfuse-checkpoint -p memfuse-db

  # KONSOLIDIERUNGS-HINWEIS: Der redundante context-gates Job wurde hier entfernt.
  # Die Kanonische Quelle für Context Integrity Gates ist .github/workflows/context-gates.yml,
  # welcher als dedizierter Workflow parallel auf push/pull_request läuft.
