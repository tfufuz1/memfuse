# .github/workflows/jules-invoke.yml
name: Jules Invoke

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: 'ID des zu triggernden Jules Accounts (01-13)'
        required: true
      instruction:
        description: 'Die explizite SUCCESSOR-Anweisung des Vorgänger-Agenten'
        required: true
        default: 'Behebe offene ANCHER in deinem Scope.'

jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Dynamic API Key
        id: api_key
        run: |
          KEY_VAR="JULES_API_KEY_${{ inputs.account_id }}"
          SELECTED_KEY="${!KEY_VAR}"
          
          # Mask it from logs
          echo "::add-mask::$SELECTED_KEY"
          
          # If not found, use a fallback like Reserve (13) or throw error
          if [ -z "$SELECTED_KEY" ]; then
            echo "Error: Key $KEY_VAR not found in secrets!"
            # Fallback to 13
            SELECTED_KEY="${JULES_API_KEY_13}"
          fi
          echo "final_key=$SELECTED_KEY" >> $GITHUB_OUTPUT
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
          JULES_API_KEY_01: ${{ secrets.JULES_API_KEY_01 }}
          JULES_API_KEY_02: ${{ secrets.JULES_API_KEY_02 }}
          JULES_API_KEY_03: ${{ secrets.JULES_API_KEY_03 }}
          JULES_API_KEY_04: ${{ secrets.JULES_API_KEY_04 }}
          JULES_API_KEY_05: ${{ secrets.JULES_API_KEY_05 }}
          JULES_API_KEY_06: ${{ secrets.JULES_API_KEY_06 }}
          JULES_API_KEY_07: ${{ secrets.JULES_API_KEY_07 }}
          JULES_API_KEY_08: ${{ secrets.JULES_API_KEY_08 }}
          JULES_API_KEY_09: ${{ secrets.JULES_API_KEY_09 }}
          JULES_API_KEY_10: ${{ secrets.JULES_API_KEY_10 }}
          JULES_API_KEY_11: ${{ secrets.JULES_API_KEY_11 }}
          JULES_API_KEY_12: ${{ secrets.JULES_API_KEY_12 }}
          JULES_API_KEY_13: ${{ secrets.JULES_API_KEY_13 }}

      - name: Generate Complete Prompt
        id: generate_prompt
        run: |
          # Generate base context using script (Preamble + Account context)
          bash .agent/jules/scripts/generate-jules-prompt.sh "${{ inputs.account_id }}" > full_prompt.txt
          
          # Append the dynamic instruction from the predecessor
          echo "" >> full_prompt.txt
          echo "═══════════════════════════════════════════════════════════════" >> full_prompt.txt
          echo "  LAYER 4: IMMEDIATE SUCCESSOR TASK" >> full_prompt.txt
          echo "═══════════════════════════════════════════════════════════════" >> full_prompt.txt
          echo "" >> full_prompt.txt
          echo "Hier ist deine unmittelbare Event-Task (SUCCESSOR) von deinem Vorgänger:" >> full_prompt.txt
          echo "---" >> full_prompt.txt
          echo "${{ inputs.instruction }}" >> full_prompt.txt
          echo "---" >> full_prompt.txt
          echo "Bitte finde den dazu passenden READY-Anchor im Code, erledige die Aufgabe (inkl. Triple-Test-Gate), setze ihn auf DONE und generiere zwingend den SUCCESSOR-Anchor für den nächsten Agenten." >> full_prompt.txt
          
          # Put into Action Step Summary
          cat full_prompt.txt >> $GITHUB_STEP_SUMMARY
          
          # Multiline output to GITHUB_OUTPUT
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "prompt<<$EOF" >> $GITHUB_OUTPUT
          cat full_prompt.txt >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Jules Trigger (Labs Action)
        uses: google-labs-code/jules-action@v1.0.0
        with:
          api-key: ${{ steps.api_key.outputs.final_key }}
          instruction: ${{ steps.generate_prompt.outputs.prompt }}
