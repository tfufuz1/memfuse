name: Nightly Chaos Matrix Tests

on:
  schedule:
    # Täglich um 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  chaos-matrix:
    name: Nightly Chaos Matrix Fault-Injection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: |
          if ! command -v just &> /dev/null; then
            cargo install just || true
          fi

      - name: Run Chaos Matrix Test Suite
        id: chaos
        run: just chaos-test

      - name: Report Chaos Test Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Nightly Chaos Matrix Test Failed (${new Date().toISOString().slice(0, 10)})`;
            const body = `## Chaos Matrix Test Failure Report

The nightly chaos matrix fault-injection test suite encountered a failure.

### Job Details
- **Workflow Run**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
- **Trigger**: ${context.eventName}
- **Branch/Ref**: ${context.ref}

### Action Required
Please check the job log above to retrieve the **CHAOS MATRIX SEED** logged during execution.
To reproduce and debug locally with the exact same seed, run:
\`\`\`bash
CHAOS_SEED=<seed> just chaos-test
\`\`\`;
`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ["bug", "automated", "chaos-test"]
            });
