# AGENT:11
name: DAG Integrity Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  verify-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Check L3 Kernel Isolation (core, runtime, orchestrator)
        run: |
          set -e
          for CRATE in memfuse-core memfuse-runtime memfuse-orchestrator; do
            echo "Verifying $CRATE imports no internal crates..."
            # Using grep -E to match any internal crate starting with 'memfuse-' but not the crate itself
            if cargo tree -p "$CRATE" --edges no-dev | grep "memfuse-" | grep -v "$CRATE" | grep -q .; then
              echo "ERROR: $CRATE imports forbidden internal crates."
              cargo tree -p "$CRATE" --edges no-dev | grep "memfuse-"
              exit 1
            fi
          done

      - name: Check L2/L1 isolation (store, index, text, checkpoint, db)
        run: |
          set -e
          echo "Verifying memfuse-store isolation..."
          if cargo tree -p memfuse-store --edges no-dev | grep -E -q "memfuse-db|memfuse-index|memfuse-text|memfuse-checkpoint|memfuse-py"; then
            echo "ERROR: memfuse-store imports higher layer or peer crates."
            exit 1
          fi
          echo "Verifying memfuse-index isolation..."
          if cargo tree -p memfuse-index --edges no-dev | grep -E -q "memfuse-db|memfuse-store|memfuse-text|memfuse-checkpoint|memfuse-py"; then
            echo "ERROR: memfuse-index imports higher layer or peer crates."
            exit 1
          fi
          echo "Verifying memfuse-text isolation..."
          # Note: DAG-001 (memfuse-store) is tracked below
          if cargo tree -p memfuse-text --edges no-dev | grep -E -q "memfuse-db|memfuse-index|memfuse-checkpoint|memfuse-py"; then
            echo "ERROR: memfuse-text imports forbidden higher layer or peer crates."
            exit 1
          fi
          echo "Verifying memfuse-checkpoint isolation..."
          # Note: DAG-002 (memfuse-store) is tracked below
          if cargo tree -p memfuse-checkpoint --edges no-dev | grep -E -q "memfuse-db|memfuse-index|memfuse-text|memfuse-py"; then
            echo "ERROR: memfuse-checkpoint imports forbidden higher layer or peer crates."
            exit 1
          fi
          echo "Verifying memfuse-db isolation..."
          if cargo tree -p memfuse-db --edges no-dev | grep -E -q "memfuse-py"; then
            echo "ERROR: memfuse-db imports higher layer crates."
            exit 1
          fi

      - name: Check known DAG violations (tracking)
        run: |
          set -e
          echo "=== Known DAG Violations (tracked via ANKERs) ==="
          echo "--- DAG-001: memfuse-text → memfuse-store ---"
          if cargo tree -p memfuse-text --edges no-dev | grep -q "memfuse-store"; then
            echo "⚠️  DAG-001 still present (memfuse-text → memfuse-store)"
          else
            echo "✅ DAG-001 resolved"
          fi
          echo "--- DAG-002: memfuse-checkpoint → memfuse-store ---"
          if cargo tree -p memfuse-checkpoint --edges no-dev | grep -q "memfuse-store"; then
            echo "⚠️  DAG-002 still present (memfuse-checkpoint → memfuse-store)"
          else
            echo "✅ DAG-002 resolved"
          fi
          echo "--- DAG-003: memfuse-py → memfuse-db ---"
          if cargo tree -p memfuse-py --edges no-dev | grep -q "memfuse-db"; then
            echo "⚠️  DAG-003 still present (memfuse-py → memfuse-db)"
          else
            echo "✅ DAG-003 resolved"
          fi
