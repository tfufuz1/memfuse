# AGENT:11
name: DAG Integrity Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  verify-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Check L1 Kernel Isolation (core)
        run: |
          set -e
          for CRATE in memfuse-core; do
            echo "Verifying $CRATE isolation..."
            if cargo tree -p "$CRATE" --edges no-dev | grep "memfuse-" | grep -v "$CRATE" | grep -q .; then
              echo "ERROR: $CRATE imports forbidden internal crates."
              cargo tree -p "$CRATE" --edges no-dev | grep "memfuse-"
              exit 1
            fi
          done

      - name: Check L2 Peer Isolation (store, index, text, graph, crypto)
        run: |
          set -e
          echo "Verifying memfuse-store (permitted: core, crypto)..."
          if cargo tree -p memfuse-store --edges no-dev | grep "memfuse-" | grep -E -v "memfuse-store|memfuse-core|memfuse-crypto" | grep -q .; then
            echo "ERROR: memfuse-store violates DAG by importing forbidden crates."
            cargo tree -p memfuse-store --edges no-dev | grep "memfuse-"
            exit 1
          fi
          echo "Verifying memfuse-index (permitted: core, graph)..."
          if cargo tree -p memfuse-index --edges no-dev | grep "memfuse-" | grep -E -v "memfuse-index|memfuse-core|memfuse-graph" | grep -q .; then
            echo "ERROR: memfuse-index violates DAG by importing forbidden crates."
            cargo tree -p memfuse-index --edges no-dev | grep "memfuse-"
            exit 1
          fi
          echo "Verifying memfuse-text..."
          if cargo tree -p memfuse-text --edges no-dev | grep -E -v "memfuse-text|memfuse-core" | grep -q "memfuse-"; then
            echo "ERROR: memfuse-text violates DAG."
            cargo tree -p memfuse-text --edges no-dev | grep "memfuse-"
            exit 1
          fi

      - name: Check L3 Orchestration Isolation (db)
        run: |
          set -e
          echo "Verifying memfuse-db..."
          if cargo tree -p memfuse-db --edges no-dev | grep -E -q "memfuse-py"; then
            echo "ERROR: memfuse-db imports higher layers."
            cargo tree -p memfuse-db --edges no-dev | grep -E "memfuse-py"
            exit 1
          fi

      - name: Check L4 Bindings Isolation (py)
        run: |
          set -e
          echo "Verifying memfuse-py..."
          # py can import db, store, etc. but not sandbox/saos-agent (L5 apps)
          if cargo tree -p memfuse-py --edges no-dev | grep -E -q "memfuse-sandbox|memfuse-saos-agent"; then
            echo "ERROR: memfuse-py violates isolation."
            cargo tree -p memfuse-py --edges no-dev | grep -E "memfuse-sandbox|memfuse-saos-agent"
            exit 1
          fi

      - name: Check L5 App Isolation (sandbox, saos-agent, checkpoint)
        run: |
          set -e
          for CRATE in memfuse-sandbox memfuse-saos-agent memfuse-checkpoint; do
            echo "Verifying $CRATE..."
            # L5 should not be imported by anyone else (already checked above)
            # And they should not import L4 (py)
            if cargo tree -p "$CRATE" --edges no-dev | grep -q "memfuse-py"; then
               echo "ERROR: $CRATE imports memfuse-py."
               exit 1
            fi
          done

      - name: Check known DAG violations (tracking)
        run: |
          set -e
          echo "=== Known DAG Violations (tracking via ANKERs) ==="
          echo "--- DAG-002: memfuse-checkpoint → memfuse-store ---"
          if cargo tree -p memfuse-checkpoint --edges no-dev | grep -q "memfuse-store"; then
            echo "⚠️  DAG-002 still present (memfuse-checkpoint → memfuse-store)"
          else
            echo "✅ DAG-002 resolved"
          fi
