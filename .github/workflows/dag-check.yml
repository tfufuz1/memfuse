# AGENT:11
name: DAG Integrity Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  verify-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Check L1 Kernel Isolation (core, crypto, sandbox, graph)
        run: |
          set -e
          for CRATE in memfuse-core memfuse-crypto memfuse-sandbox memfuse-graph; do
            echo "Verifying $CRATE isolation..."
            if cargo tree -p "$CRATE" --edges no-dev | grep "memfuse-" | grep -E -v "$CRATE|memfuse-core" | grep -q .; then
              echo "ERROR: $CRATE imports forbidden internal crates."
              cargo tree -p "$CRATE" --edges no-dev | grep "memfuse-"
              exit 1
            fi
          done

      - name: Check L2 peer isolation (store, index, text, checkpoint)
        run: |
          set -e
          echo "Verifying memfuse-store..."
          if cargo tree -p memfuse-store --edges no-dev | grep -E -v "memfuse-store|memfuse-core|memfuse-crypto" | grep -q "memfuse-"; then
            echo "ERROR: memfuse-store violates DAG by importing non-core/crypto crates."
            cargo tree -p memfuse-store --edges no-dev | grep "memfuse-"
            exit 1
          fi
          echo "Verifying memfuse-index..."
          if cargo tree -p memfuse-index --edges no-dev | grep -E -v "memfuse-index|memfuse-core|memfuse-graph" | grep -q "memfuse-"; then
            echo "ERROR: memfuse-index violates DAG by importing non-core/graph crates."
            cargo tree -p memfuse-index --edges no-dev | grep "memfuse-"
            exit 1
          fi
          echo "Verifying memfuse-text..."
          if cargo tree -p memfuse-text --edges no-dev | grep -E -v "memfuse-text|memfuse-core" | grep -q "memfuse-"; then
            echo "ERROR: memfuse-text violates DAG by importing non-core crates."
            cargo tree -p memfuse-text --edges no-dev | grep "memfuse-"
            exit 1
          fi
          echo "Verifying memfuse-checkpoint (excluding tracked DAG-002)..."
          if cargo tree -p memfuse-checkpoint --edges no-dev | grep -E -v "memfuse-checkpoint|memfuse-core|memfuse-store" | grep -q "memfuse-"; then
            echo "ERROR: memfuse-checkpoint violates DAG."
            cargo tree -p memfuse-checkpoint --edges no-dev | grep "memfuse-"
            exit 1
          fi

      - name: Check L3 Orchestration Isolation (db, saos-agent)
        run: |
          set -e
          for CRATE in memfuse-db memfuse-saos-agent; do
            echo "Verifying $CRATE..."
            if cargo tree -p "$CRATE" --edges no-dev | grep -E -q "memfuse-py"; then
              echo "ERROR: $CRATE imports higher layers."
              cargo tree -p "$CRATE" --edges no-dev | grep "memfuse-py"
              exit 1
            fi
          done

      - name: Check L4 Bindings Isolation (py)
        run: |
          set -e
          echo "Verifying memfuse-py..."
          # L4 can import anything below it, but we maintain architectural separation
          # where bindings should primarily interact with L3 (Orchestration).
          # Rule: memfuse-py should not import L1 Kernel components directly (e.g., sandbox).
          if cargo tree -p memfuse-py --edges no-dev | grep -q "memfuse-sandbox"; then
             echo "ERROR: memfuse-py imports L1 sandbox directly."
             cargo tree -p memfuse-py --edges no-dev | grep "memfuse-sandbox"
             exit 1
          fi

      - name: Check known DAG violations (tracking)
        run: |
          set -e
          echo "=== Known DAG Violations (tracked via ANKERs) ==="
          echo "--- DAG-002: memfuse-checkpoint → memfuse-store ---"
          if cargo tree -p memfuse-checkpoint --edges no-dev | grep -q "memfuse-store"; then
            echo "⚠️  DAG-002 still present (memfuse-checkpoint → memfuse-store)"
          else
            echo "✅ DAG-002 resolved"
          fi
          echo "--- DAG-003: memfuse-py → memfuse-db ---"
          if cargo tree -p memfuse-py --edges no-dev | grep -q "memfuse-db"; then
            echo "⚠️  DAG-003 still present (memfuse-py → memfuse-db)"
          else
            echo "✅ DAG-003 resolved"
          fi
