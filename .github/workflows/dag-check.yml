# AGENT:11
name: DAG Integrity Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  verify-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Check L1 Foundation Isolation (core)
        run: |
          set -e
          echo "Verifying memfuse-core isolation..."
          if cargo tree -p memfuse-core --edges no-dev | grep "memfuse-" | grep -v "memfuse-core" | grep -q .; then
            echo "ERROR: memfuse-core imports forbidden internal crates."
            cargo tree -p memfuse-core --edges no-dev | grep "memfuse-"
            exit 1
          fi

      - name: Check L2 Engine & Support Isolation (store, index, text, crypto, graph, checkpoint, sandbox)
        run: |
          set -e
          for CRATE in memfuse-store memfuse-index memfuse-text memfuse-crypto memfuse-graph memfuse-checkpoint memfuse-sandbox; do
            echo "Verifying $CRATE isolation..."
            # Engines may only import core or audited peer engines
            EXCLUSIONS="$CRATE|memfuse-core"
            if [ "$CRATE" = "memfuse-store" ]; then EXCLUSIONS="$EXCLUSIONS|memfuse-crypto"; fi
            if [ "$CRATE" = "memfuse-index" ]; then EXCLUSIONS="$EXCLUSIONS|memfuse-graph"; fi

            if cargo tree -p "$CRATE" --edges no-dev | grep "memfuse-" | grep -E -v "$EXCLUSIONS" | grep -q .; then
              echo "ERROR: $CRATE violates DAG by importing forbidden crates."
              cargo tree -p "$CRATE" --edges no-dev | grep "memfuse-"
              exit 1
            fi
          done

      - name: Check L3 Orchestration Isolation (db)
        run: |
          set -e
          echo "Verifying memfuse-db..."
          # db may import L1 and L2, but not L4
          if cargo tree -p memfuse-db --edges no-dev | grep "memfuse-" | grep -E -q "memfuse-py|memfuse-saos-agent"; then
            echo "ERROR: memfuse-db imports higher layers."
            cargo tree -p memfuse-db --edges no-dev | grep "memfuse-"
            exit 1
          fi

      - name: Check L4 Bindings & Agents Isolation (py, saos-agent)
        run: |
          set -e
          for CRATE in memfuse-py memfuse-saos-agent; do
            echo "Verifying $CRATE isolation..."
            # L4 are top-level, they can import L1, L2, L3.
            # We just check for circular if necessary, but usually cargo handles it.
            echo "$CRATE is a top-level crate."
          done

      - name: Check known DAG violations (tracking)
        run: |
          set -e
          echo "=== Known DAG Violations (tracked via ANKERs) ==="
          echo "--- DAG-002: memfuse-checkpoint → memfuse-store ---"
          if cargo tree -p memfuse-checkpoint --edges no-dev | grep -q "memfuse-store"; then
            echo "⚠️  DAG-002 still present (memfuse-checkpoint → memfuse-store)"
          else
            echo "✅ DAG-002 resolved"
          fi
          echo "--- DAG-003: memfuse-py → memfuse-db ---"
          if cargo tree -p memfuse-py --edges no-dev | grep -q "memfuse-db"; then
            echo "⚠️  DAG-003 still present (memfuse-py → memfuse-db)"
          else
            echo "✅ DAG-003 resolved"
          fi
