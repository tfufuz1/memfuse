name: DAG Integrity Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  verify-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        run: cargo install just

      - name: Run DAG check
        run: just dag-check
