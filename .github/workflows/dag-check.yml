# AGENT:11
name: DAG Integrity Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  verify-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Check L1 Kernel Isolation (core)
        run: |
          set -e
          echo "Verifying memfuse-core isolation..."
          if cargo tree -p memfuse-core --edges no-dev | grep "memfuse-" | grep -E -v "memfuse-core" | grep -q .; then
            echo "ERROR: memfuse-core imports forbidden internal crates."
            cargo tree -p memfuse-core --edges no-dev | grep "memfuse-"
            exit 1
          fi

      - name: Check L2 peer isolation (store, index, text, checkpoint)
        run: |
          set -e
          echo "Verifying memfuse-store..."
          if cargo tree -p memfuse-store --edges no-dev | grep -E -v "memfuse-store|memfuse-core|memfuse-crypto" | grep -q "memfuse-"; then
            echo "ERROR: memfuse-store violates DAG by importing non-core crates."
            cargo tree -p memfuse-store --edges no-dev | grep "memfuse-"
            exit 1
          fi
          echo "Verifying memfuse-index..."
          if cargo tree -p memfuse-index --edges no-dev | grep -E -v "memfuse-index|memfuse-core|memfuse-graph" | grep -q "memfuse-"; then
            echo "ERROR: memfuse-index violates DAG by importing non-core crates."
            cargo tree -p memfuse-index --edges no-dev | grep "memfuse-"
            exit 1
          fi
          echo "Verifying memfuse-text..."
          if cargo tree -p memfuse-text --edges no-dev | grep -E -v "memfuse-text|memfuse-core" | grep -q "memfuse-"; then
            echo "ERROR: memfuse-text violates DAG by importing non-core crates."
            cargo tree -p memfuse-text --edges no-dev | grep "memfuse-"
            exit 1
          fi
          echo "Verifying memfuse-checkpoint (excluding tracked DAG-002)..."
          if cargo tree -p memfuse-checkpoint --edges no-dev | grep -E -v "memfuse-checkpoint|memfuse-core|memfuse-store|memfuse-crypto" | grep -q "memfuse-"; then
            echo "ERROR: memfuse-checkpoint violates DAG."
            cargo tree -p memfuse-checkpoint --edges no-dev | grep "memfuse-"
            exit 1
          fi

      - name: Check L3 Orchestration Isolation (db)
        run: |
          set -e
          echo "Verifying memfuse-db..."
          if cargo tree -p memfuse-db --edges no-dev | grep -E -q "memfuse-py"; then
            echo "ERROR: memfuse-db imports higher layers."
            cargo tree -p memfuse-db --edges no-dev | grep -E "memfuse-py"
            exit 1
          fi

      - name: Check L4 Bindings Isolation (py)
        run: |
          set -e
          echo "Verifying memfuse-py..."

      - name: Check L3/L4 Services & Workflows Isolation (agent, embed, ollama, mcp, tauri)
        run: |
          set -e
          echo "Verifying memfuse-embed..."
          if cargo tree -p memfuse-embed --edges no-dev | grep -E -v "memfuse-embed|memfuse-core" | grep -q "memfuse-"; then
            echo "ERROR: memfuse-embed violates DAG."
            cargo tree -p memfuse-embed --edges no-dev | grep "memfuse-"
            exit 1
          fi
          echo "Verifying memfuse-ollama..."
          if cargo tree -p memfuse-ollama --edges no-dev | grep -E -v "memfuse-ollama|memfuse-core" | grep -q "memfuse-"; then
            echo "ERROR: memfuse-ollama violates DAG."
            cargo tree -p memfuse-ollama --edges no-dev | grep "memfuse-"
            exit 1
          fi
          echo "Verifying memfuse-agent..."
          if cargo tree -p memfuse-agent --edges no-dev | grep -E -v "memfuse-agent|memfuse-core|memfuse-db|memfuse-graph|memfuse-checkpoint|memfuse-store|memfuse-crypto|memfuse-index|memfuse-text|memfuse-ollama|memfuse-router" | grep -q "memfuse-"; then
            echo "ERROR: memfuse-agent violates DAG."
            cargo tree -p memfuse-agent --edges no-dev | grep "memfuse-"
            exit 1
          fi
          echo "Verifying memfuse-mcp..."
          if cargo tree -p memfuse-mcp --edges no-dev | grep -E -v "memfuse-mcp|memfuse-core|memfuse-db|memfuse-crypto|memfuse-ollama|memfuse-agent|memfuse-graph|memfuse-checkpoint|memfuse-store|memfuse-index|memfuse-text" | grep -q "memfuse-"; then
            echo "ERROR: memfuse-mcp violates DAG."
            cargo tree -p memfuse-mcp --edges no-dev | grep "memfuse-"
            exit 1
          fi
          echo "Verifying memfuse-tauri..."
          if cargo tree -p memfuse-tauri --edges no-dev | grep -E -v "memfuse-tauri|memfuse-core|memfuse-db|memfuse-graph|memfuse-ollama|memfuse-checkpoint|memfuse-store|memfuse-crypto|memfuse-index|memfuse-text" | grep -q "memfuse-"; then
            echo "ERROR: memfuse-tauri violates DAG."
            cargo tree -p memfuse-tauri --edges no-dev | grep "memfuse-"
            exit 1
          fi
          echo "Verifying memfuse-router..."
          if cargo tree -p memfuse-router --edges no-dev | grep -E -v "memfuse-router|memfuse-core|memfuse-db|memfuse-ollama|memfuse-graph|memfuse-checkpoint|memfuse-store|memfuse-crypto|memfuse-index|memfuse-text" | grep -q "memfuse-"; then
            echo "ERROR: memfuse-router violates DAG."
            cargo tree -p memfuse-router --edges no-dev | grep "memfuse-"
            exit 1
          fi

      - name: Check all workspace members covered in dag-check workflow
        run: |
          set -e
          MEMBERS=$(grep -oP '"crates/\K[^"]+' Cargo.toml)
          for m in $MEMBERS; do
            grep -q "$m" .github/workflows/dag-check.yml || { echo "FEHLT in dag-check.yml: $m"; exit 1; }
          done
          echo "✅ Alle Workspace Member sind im dag-check.yml abgedeckt."

      - name: Check known DAG violations (tracking)
        run: |
          set -e
          echo "=== Known DAG Violations (tracked via ANKERs) ==="
          echo "--- DAG-002: memfuse-checkpoint → memfuse-store ---"
          if cargo tree -p memfuse-checkpoint --edges no-dev | grep -q "memfuse-store"; then
            echo "⚠️  DAG-002 still present (memfuse-checkpoint → memfuse-store)"
          else
            echo "✅ DAG-002 resolved"
          fi
          echo "--- DAG-003: memfuse-py → memfuse-db ---"
          if cargo tree -p memfuse-py --edges no-dev | grep -q "memfuse-db"; then
            echo "⚠️  DAG-003 still present (memfuse-py → memfuse-db)"
          else
            echo "✅ DAG-003 resolved"
          fi
