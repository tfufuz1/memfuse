name: DAG Integrity Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  verify-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Check Layer 3 (Kernel — imports NOBODY internal)
        run: |
          set -e
          echo "Verifying Layer 3 (core, runtime, orchestrator) isolation..."
          # L3 crates should not import L2, L1, or L0
          FORBIDDEN="memfuse-store\|memfuse-db\|memfuse-index\|memfuse-text\|memfuse-checkpoint\|memfuse-py"
          for c in memfuse-core memfuse-runtime memfuse-orchestrator; do
            echo "Checking $c..."
            if cargo tree -p $c --edges no-dev | grep -q "$FORBIDDEN"; then
              echo "ERROR: $c imports forbidden crates."
              exit 1
            fi
          done

      - name: Check Layer 2 (Peers — isolation and L3 only)
        run: |
          set -e
          echo "Verifying Layer 2 (store, index, text, checkpoint) isolation..."
          # L2 can only import L3. Cannot import L1 or L0.
          # Also peers should be isolated (except known violations).
          FORBIDDEN_LAYERS="memfuse-db\|memfuse-py"
          CRATES="memfuse-store memfuse-index memfuse-text memfuse-checkpoint"
          for c in $CRATES; do
            echo "Checking $c for L1/L0 imports..."
            if cargo tree -p $c --edges no-dev | grep -q "$FORBIDDEN_LAYERS"; then
              echo "ERROR: $c imports forbidden L1/L0 crates."
              exit 1
            fi

            echo "Checking $c for peer isolation..."
            # Get peers by removing self from list
            PEERS=$(echo $CRATES | sed "s/\b$c\b//g" | sed 's/  / /g' | sed 's/^ //;s/ $//' | sed 's/ /\\|/g')
            if [ -n "$PEERS" ]; then
                if cargo tree -p $c --edges no-dev | grep -q "$PEERS"; then
                    echo "WARNING: $c imports peer L2 crates. This is allowed ONLY for known violations."
                    # We don't fail here yet because we have known violations DAG-001 and DAG-002.
                fi
            fi
          done

      - name: Check Layer 1 (Facade — db)
        run: |
          set -e
          echo "Verifying memfuse-db (L1) imports..."
          # L1 can import L2, L3. Cannot import L0.
          if cargo tree -p memfuse-db --edges no-dev | grep -q "memfuse-py"; then
            echo "ERROR: memfuse-db imports L0 (memfuse-py)."
            exit 1
          fi

      - name: Check known DAG violations (tracking)
        run: |
          set -e
          echo "=== Known DAG Violations (tracked via ANKERs) ==="

          echo "--- DAG-001: memfuse-text → memfuse-store ---"
          if cargo tree -p memfuse-text --edges no-dev | grep -q "memfuse-store"; then
            echo "⚠️  DAG-001 still present (memfuse-text → memfuse-store)"
          else
            echo "✅ DAG-001 resolved"
          fi

          echo "--- DAG-002: memfuse-checkpoint → memfuse-store ---"
          if cargo tree -p memfuse-checkpoint --edges no-dev | grep -q "memfuse-store"; then
            echo "⚠️  DAG-002 still present (memfuse-checkpoint → memfuse-store)"
          else
            echo "✅ DAG-002 resolved"
          fi

          echo "--- DAG-003: memfuse-py → memfuse-db ---"
          if cargo tree -p memfuse-py --edges no-dev | grep -q "memfuse-db"; then
            echo "⚠️  DAG-003 still present (memfuse-py → memfuse-db)"
          else
            echo "✅ DAG-003 resolved"
          fi
