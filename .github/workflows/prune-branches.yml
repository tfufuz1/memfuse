name: Prune Stale Remote Branches

on:
  schedule:
    # Läuft jeden Tag um 02:00 Uhr nachts UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Ermöglicht den manuellen Start über das GitHub-Webinterface
  pull_request:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run prune script
        run: |
          # Führt das Skript im schreibenden Modus aus (z.B. mit --apply, falls standardmäßig Dry-Run)
          bash scripts/prune_remote_branches.sh --apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  overlap-report:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check branch file overlap
        run: |
          git fetch origin --prune
          bash scripts/check_branch_overlap.sh "${{ github.head_ref }}"
        continue-on-error: true  # Advisory only, kein Merge-Block
