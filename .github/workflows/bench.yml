name: Benchmark Suite & Regression Baseline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bench-dry-run:
    name: Benchmark Compilation & Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Benchmark Harness Dry-Run Test
        run: |
          # Verify benchmark compilation and harness functionality without long running timings
          MEMFUSE_SCALE_TIERS=10,50 cargo bench --locked -p memfuse-db -- --test

      - name: Run Benchmark Group Baseline (Informative)
        run: |
          # Criterion baseline generation for PR artifacts
          # Note: A future session will add comparison gates against main branch baseline with tolerance bands
          MEMFUSE_SCALE_TIERS=100,500 cargo bench --locked -p memfuse-db --bench scale_bench -- --save-baseline pr-${{ github.event.number || github.sha }}

      - name: Upload Benchmark Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-criterion-data
          path: |
            target/criterion
            benches/results/scale_rss.csv

  retrieval-accuracy-bench:
    name: Retrieval Accuracy Benchmark (memfuse-bench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Retrieval Accuracy Benchmark Harness
        run: cargo run --locked -p memfuse-bench --release

      - name: Upload Retrieval Accuracy Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-accuracy-benchmark-results
          path: |
            benchmarks/results/results.json
            benchmarks/results/summary.md
            benchmarks/memfuse-bench/baseline_recall.json

  benchmark-regression:
    name: Retrieval Quality Regression Gate (LongMemEval & LoCoMo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Benchmark Harness and Comparison Tooling
        run: cargo build --locked -p memfuse-bench --release

      - name: Run LongMemEval Benchmark Execution
        # NOTE: Executed against minimal test fixtures (parser/pipeline correctness).
        # THIS IS NOT A FULL RECALL REGRESSION GATE until full external datasets
        # are downloaded or fetched via Git-LFS in a follow-up pipeline setup.
        run: |
          cargo run --locked -p memfuse-bench --release -- long-mem-eval --dataset benchmarks/memfuse-bench/tests/fixtures/long_mem_eval_fixture.json --output benchmarks/results/long_mem_eval_results.json

      - name: Run LoCoMo Benchmark Execution
        # NOTE: Executed against minimal test fixtures (parser/pipeline correctness).
        # THIS IS NOT A FULL RECALL REGRESSION GATE until full external datasets
        # are downloaded or fetched via Git-LFS in a follow-up pipeline setup.
        run: |
          cargo run --locked -p memfuse-bench --release -- locomo --dataset benchmarks/memfuse-bench/tests/fixtures/locomo_fixture.json --output benchmarks/results/locomo_results.json

      - name: Evaluate Metrics Against Versioned Baseline
        run: |
          cargo run --locked -p memfuse-bench --release --bin compare-baseline -- --current benchmarks/results/current_metrics.json --baseline benchmarks/memfuse-bench/baseline_metrics.json --threshold 0.05

      - name: Upload Retrieval Quality Regression Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-regression-metrics
          path: |
            benchmarks/results/
            benchmarks/memfuse-bench/baseline_metrics.json
