name: Mutation Testing
on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Target crate for mutation testing'
        required: true
        default: 'memfuse-crypto'
        type: string
  pull_request:
    paths:
      - 'crates/memfuse-checkpoint/**'
      - 'crates/memfuse-crypto/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutation-testing:
    name: Cargo Mutants Runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants

      - name: Determine Target Crates
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "crates=${{ github.event.inputs.crate }}" >> "$GITHUB_OUTPUT"
          else
            CRATES=""
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^crates/memfuse-checkpoint/'; then
              CRATES="$CRATES memfuse-checkpoint"
            fi
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^crates/memfuse-crypto/'; then
              CRATES="$CRATES memfuse-crypto"
            fi
            if [ -z "$CRATES" ]; then
              CRATES="memfuse-crypto"
            fi
            echo "crates=$CRATES" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Mutation Tests
        run: |
          for crate in ${{ steps.target.outputs.crates }}; do
            echo "Running cargo mutants for crate: $crate"
            cargo mutants -p "$crate" --timeout 120 --minimum-test-timeout 30 --in-place
          done

      - name: Report Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const targetCrates = "${{ steps.target.outputs.crates }}";
            const title = `🚨 Mutation Testing Failure: ${targetCrates} (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              "## Mutation Testing Failure Detected",
              "",
              "The mutation testing suite detected surviving mutants or execution failure for crate(s): `" + targetCrates + "`.",
              "",
              "### Details",
              `- **Workflow Run:** [View Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `- **Trigger:** ${context.eventName}`,
              `- **Commit:** ${context.sha}`,
              "",
              "Please review the workflow logs and run mutation testing locally:",
              "```bash",
              "cargo mutants -p <crate> --timeout 120 --minimum-test-timeout 30 --in-place",
              "```"
            ].join("\n");

            if (context.eventName !== 'pull_request') {
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                  labels: ["bug", "mutation-testing"]
                });
              } catch (err) {
                console.log("Could not auto-create issue:", err.message);
              }
            }
