name: Jules Mention Responder

on:
  issue_comment:
    types: [created]

jobs:
  jules_reply:
    # Trigger nur, wenn das Keyword @jules kommentiert wird und es ein Pull Request ist.
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '@jules') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Extrahieren der User Query
        run: |
          echo "User Query: ${{ github.event.comment.body }}" > jules_instruction.txt
          
      - name: Installiere Aider (AI Agent)
        run: python -m pip install aider-chat

      - name: Checkout PR Branch via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr checkout ${{ github.event.issue.number }}
          git config user.name "Jules PR Responder"
          git config user.email "jules-bot@memfuse.dev"

      - name: Jules Agent Ausführen (mit Triple-Test-Gate)
        env:
          # ANTHROPIC_API_KEY muss in den GitHub Actions Secrets hinterlegt sein
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Führe den Agenten aus mit automatischer Bestätigung, Autocommits 
          # und den Triple-Test / Clippy Gates fix konfiguriert als Commands.
          aider \
            --message-file jules_instruction.txt \
            --yes \
            --auto-commits \
            --test-cmd "cargo test --workspace" \
            --lint-cmd "cargo clippy --workspace -- -D warnings"
          
      - name: Push Commits to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD
