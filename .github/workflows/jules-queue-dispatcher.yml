# .github/workflows/jules-queue-dispatcher.yml
name: Jules Queue Dispatcher

on:
  push:
    branches:
      - dev

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: github.repository == 'tfufuz1/memfuse'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Lock-Sync (Proactive Protection)
        run: bash .agent/scripts/jules-sync-locks.sh

      - name: Commit Lock Changes
        run: |
          git config --global user.name "MemFuse Dispatcher"
          git config --global user.email "dispatcher@memfuse.local"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: sync jules locks [v2.0]"
          git push origin dev

      - name: Trigger next in Queue
        run: bash .agent/scripts/jules-dispatch.sh
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
