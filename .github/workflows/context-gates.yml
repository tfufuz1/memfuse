# Context Integrity Gates Workflow
# Enforces context integrity, DAG structure, tag grammar, preflight checks, and Gate 16 Commit Message Quality.

name: Context Integrity Gates

on: [push, pull_request]

jobs:
  context-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Gate -1: Xtask-Workflow-Command-Sync (Meta-Gate)"
        run: cargo run -p xtask -- check-workflow-commands

      - name: "Gate 0: Workspace Compile Check"
        run: cargo run -p xtask -- check-compile

      - name: "Check for duplicate symbols (fast pre-build gate)"
        run: cargo run -p xtask -- check-duplicate-symbols

      - name: "DAG Integrity Check"
        run: cargo xtask check-dag

      - name: "AGENTS.md Crate Integrity Gate"
        run: cargo xtask check-agents-integrity

      - name: "Gate 12: Duplicate-PR-Intent-Detection"
        env:
          MEMFUSE_PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: cargo run -p xtask -- check-duplicate-intent

      - name: "Gate 12b: Phantom-File-Verification"
        env:
          MEMFUSE_PR_BODY: ${{ github.event.pull_request.body || '' }}
          MEMFUSE_CI_BASE_REF: ${{ github.base_ref != '' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          cargo run -p xtask -- check-phantom-files
          echo "✅ Gate 12b: Keine Phantom-Dateien in Commit-Messages/PR-Body"

      - name: "Gate 1: Keine ungelösten kritischen AI-TAGs"
        run: |
          COUNT=$(grep -rE "AI-TAG\[[^]]+\]\[(CRITICAL|BLOCKER)\]" crates/ \
            --include="*.rs" | grep -vcP "(?<!UN)RESOLVED" || true)
          if [ "$COUNT" -gt 0 ]; then
            echo "❌ $COUNT ungelöste AI-TAG[CRITICAL|BLOCKER] gefunden"
            grep -rE "AI-TAG\[[^]]+\]\[(CRITICAL|BLOCKER)\]" crates/ --include="*.rs" | grep -vP "(?<!UN)RESOLVED"
            exit 1
          fi
          echo "✅ Keine offenen kritischen/blockierenden Tags"

      - name: "Gate 2: Keine neuen .unwrap()/.expect() in Produktionscode"
        run: cargo xtask check-unwrap-baseline

      # Gate 2b: Trend-Überwachung der .unwrap()/.expect() Baseline
      # - BLOCKING: Nettowachstum (net > 0) in Tier-1-Crates (memfuse-core, memfuse-crypto, memfuse-store, memfuse-index) lässt den xtask-Check mit Exit-Code 1 fehlschlagen.
      # - NON-BLOCKING: Nettowachstum in Tier-2/3-Crates wird dokumentiert und in der Historie erfasst, blockiert die CI jedoch nicht direkt.
      - name: "Gate 2b: Trend-Überwachung der .unwrap()/.expect() Baseline"
        env:
          MEMFUSE_CI_BASE_REF: ${{ github.base_ref || github.event.before || 'origin/main' }}
        run: cargo run -p xtask -- check-unwrap-baseline-trend

      - name: "Gate 3: Kein silent let _ für IO-Operationen"
        run: |
          if grep -rn "let _ = .*sync\|let _ = .*flush\|let _ = .*write" \
             crates/ --include="*.rs"; then
            echo "❌ Silent IO-Fehler gefunden — propagiere mit ?"
            exit 1
          fi
          cargo clippy --workspace -- \
            -D clippy::unused_must_use \
            -W clippy::let_underscore_must_use
          echo "✅ Keine silent IO-Fehler"

      - name: "Gate 4: axum nicht in memfuse-mcp"
        run: |
          if grep -q "axum" crates/memfuse-mcp/Cargo.toml 2>/dev/null; then
            echo "❌ axum-Dependency in memfuse-mcp — ADR-010 verletzt (stdio only)"
            exit 1
          fi
          echo "✅ memfuse-mcp korrekt: kein axum"

      - name: "Gate 4b: Kein allow(unsafe_code) in memfuse-core"
        run: |
          if grep -rn "allow(unsafe_code)" crates/memfuse-core/src 2>/dev/null; then
            echo "❌ allow(unsafe_code) in memfuse-core/src gefunden"
            exit 1
          fi
          echo "✅ memfuse-core/src ist zero-allow(unsafe_code)"

      - name: "Gate 4c: Kein allow(unsafe_code) in memfuse-mcp"
        run: |
          if grep -rn "allow(unsafe_code)" crates/memfuse-mcp/src 2>/dev/null; then
            echo "❌ allow(unsafe_code) in memfuse-mcp/src gefunden"
            exit 1
          fi
          echo "✅ memfuse-mcp/src ist zero-allow(unsafe_code)"

      - name: "Gate 6: Keine TODOs ohne AI-TAG Grammatik"
        run: |
          TODO_WITHOUT_TAG=$(grep -rn "TODO" crates/ --include="*.rs" | grep -v "AI-TAG" || true)
          if [ -n "$TODO_WITHOUT_TAG" ]; then
            echo "❌ TODO ohne AI-TAG Grammatik in Rust-Dateien gefunden:"
            echo "$TODO_WITHOUT_TAG"
            exit 1
          fi
          echo "✅ Alle TODOs nutzen AI-TAG Syntax"

      - name: Gate 7 — ISO-8601 tag validation
        run: cargo xtask validate-tags

      - name: "Gate 5: Dokumentation ist synchron mit Inline-Tags (kein Drift)"
        run: |
          cargo run -p xtask -- sync-docs
          if ! git diff --quiet -- WORKING_STATE.md docs/ARCHITECTURE.md docs/SOURCE_OF_TRUTH.md; then
            echo "❌ Generierte Doku-Abschnitte sind veraltet. Lokal ausführen:"
            echo "    just sync-docs"
            echo "und den Diff committen."
            git --no-pager diff -- WORKING_STATE.md docs/ARCHITECTURE.md docs/SOURCE_OF_TRUTH.md
            exit 1
          fi
          echo "✅ Dokumentation synchron mit Code"

      - name: "Gate 8: Mehrfach-Session-Review vor DONE erzwungen"
        run: |
          cargo run -p xtask -- check-review-coverage
          echo "✅ Mehrfach-Session-Review-Abdeckung verifiziert"

      - name: "Gate 9: Konsistenzprüfung der Dokumentation"
        run: |
          cargo run -p xtask -- check-consistency
          echo "✅ Konsistenzprüfung erfolgreich"

      - name: "Gate 13: Keine Platzhalter-Referenzen in Governance-Dokumenten"
        run: cargo run -p xtask -- check-placeholder-refs

      - name: "Gate 16: ADR Deprecation & Removal Deadline Monitoring"
        run: cargo run -p xtask -- check-adr-deadlines

      - name: "Gate 10: Jules Context Frischeprüfung"
        run: |
          cargo run -p xtask -- check-jules-context-freshness
          echo "✅ Jules Context Frischeprüfung erfolgreich"

      - name: "Gate 11: AGENTS.md Template Validierung"
        run: |
          # Prüft, ob alle AGENTS.md die erforderlichen 8 Sektionen enthalten
          for file in crates/*/AGENTS.md; do
            if [ -f "$file" ]; then
              for section in \
                "## 1. Zweck & Architekturrolle" \
                "## 2. Modul-Karte" \
                "## 3. Kritische Invarianten" \
                "## 4. Public API Quick-Reference" \
                "## 5. Anti-Patterns & LLM-Fallstricke" \
                "## 6. Concurrency & Lock-Hierarchie" \
                "## 7. Cross-Crate-Schnittstellen & DAG-Grenzen" \
                "## 8. Relevante ADRs & Rules"; do
                if ! grep -q "$section" "$file"; then
                  echo "❌ Sektion fehlt in $file: $section"
                  exit 1
                fi
              done
            fi
          done
          echo "✅ Alle AGENTS.md Dateien entsprechen dem 8-Sektionen-Template"

      - name: "Gate 15: Validierung von Dateipfad-Referenzen in Dokumenten"
        run: cargo run -p xtask -- check-doc-references

      # TODO(opt-RC-1/A-2): Enforce MEMFUSE_CLAIM_CRATE extraction from PR body across all PR gates and verify required check status on main.
      - name: "Gate 14: Jules Preflight Aggregator + Claim-Check"
        env:
          MEMFUSE_CI: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Claim-Crate aus PR-Body extrahieren (Pflichtfeld)
          PR_BODY="${{ github.event.pull_request.body || '' }}"
          CLAIM_CRATE=$(echo "$PR_BODY" | grep -oP '(?<=Claim-Crate: )\S+' || true)
          if [ -n "$CLAIM_CRATE" ] && [ "$CLAIM_CRATE" != "<!--" ]; then
            export MEMFUSE_CLAIM_CRATE="$CLAIM_CRATE"
            echo "ℹ️ Claim-Crate aus PR-Body: $CLAIM_CRATE"
          else
            echo "⚠️ Kein Claim-Crate in PR-Body gefunden — Claim-Check wird übersprungen"
          fi
          cargo run -p xtask -- jules-preflight --fast
          echo "✅ Jules Preflight: alle Checks bestanden"

      - name: "Gate 16: Commit Message Quality"
        env:
          MEMFUSE_CI_BASE_REF: ${{ github.base_ref != '' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: cargo run -p xtask -- check-commit-messages
