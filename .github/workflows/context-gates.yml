name: Context Integrity Gates

on: [push, pull_request]

jobs:
  context-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Gate 1: Keine ungelösten kritischen AI-TAGs"
        run: |
          COUNT=$(grep -rE "AI-TAG\[[^]]+\]\[(CRITICAL|BLOCKER)\]" crates/ \
            --include="*.rs" | grep -vc "RESOLVED" || true)
          if [ "$COUNT" -gt 0 ]; then
            echo "❌ $COUNT ungelöste AI-TAG[CRITICAL|BLOCKER] gefunden"
            grep -rE "AI-TAG\[[^]]+\]\[(CRITICAL|BLOCKER)\]" crates/ --include="*.rs" | grep -v "RESOLVED"
            exit 1
          fi
          echo "✅ Keine offenen kritischen/blockierenden Tags"

      - name: "Gate 2: Keine neuen .unwrap()/.expect() in Produktionscode"
        run: cargo xtask check-unwrap-baseline

      - name: "Gate 3: Kein silent let _ für IO-Operationen"
        run: |
          if grep -rn "let _ = .*sync\|let _ = .*flush\|let _ = .*write" \
             crates/ --include="*.rs"; then
            echo "❌ Silent IO-Fehler gefunden — propagiere mit ?"
            exit 1
          fi
          echo "✅ Keine silent IO-Fehler"

      - name: "Gate 4: axum nicht in memfuse-mcp"
        run: |
          if grep -q "axum" crates/memfuse-mcp/Cargo.toml 2>/dev/null; then
            echo "❌ axum-Dependency in memfuse-mcp — ADR-010 verletzt (stdio only)"
            exit 1
          fi
          echo "✅ memfuse-mcp korrekt: kein axum"

      - name: "Gate 6: Keine TODOs ohne AI-TAG Grammatik"
        run: |
          TODO_WITHOUT_TAG=$(grep -rn "TODO" crates/ --include="*.rs" | grep -v "AI-TAG" || true)
          if [ -n "$TODO_WITHOUT_TAG" ]; then
            echo "❌ TODO ohne AI-TAG Grammatik in Rust-Dateien gefunden:"
            echo "$TODO_WITHOUT_TAG"
            exit 1
          fi
          echo "✅ Alle TODOs nutzen AI-TAG Syntax"

      - name: Gate 7 — ISO-8601 tag validation
        run: cargo xtask validate-tags

      - name: "Gate 5: Dokumentation ist synchron mit Inline-Tags (kein Drift)"
        run: |
          cargo run -p xtask -- sync-docs
          if ! git diff --quiet -- WORKING_STATE.md docs/ARCHITECTURE.md docs/SOURCE_OF_TRUTH.md; then
            echo "❌ Generierte Doku-Abschnitte sind veraltet. Lokal ausführen:"
            echo "    just sync-docs"
            echo "und den Diff committen."
            git --no-pager diff -- WORKING_STATE.md docs/ARCHITECTURE.md docs/SOURCE_OF_TRUTH.md
            exit 1
          fi
          echo "✅ Dokumentation synchron mit Code"

      - name: "Gate 8: Mehrfach-Session-Review vor DONE erzwungen"
        run: |
          cargo run -p xtask -- check-review-coverage
          echo "✅ Mehrfach-Session-Review-Abdeckung verifiziert"

      - name: "Gate 9: Konsistenzprüfung der Dokumentation"
        run: |
          cargo run -p xtask -- check-consistency
          echo "✅ Konsistenzprüfung erfolgreich"

      - name: "Gate 10: Jules Context Frischeprüfung"
        run: |
          cargo run -p xtask -- check-jules-context-freshness
          echo "✅ Jules Context Frischeprüfung erfolgreich"

      - name: "Gate 11: AGENTS.md Template Validierung"
        run: |
          # Prüft, ob alle AGENTS.md die erforderlichen 8 Sektionen enthalten
          for file in crates/*/AGENTS.md; do
            if [ -f "$file" ]; then
              for section in \
                "## 1. Zweck & Architekturrolle" \
                "## 2. Modul-Karte" \
                "## 3. Kritische Invarianten" \
                "## 4. Public API Quick-Reference" \
                "## 5. Anti-Patterns & LLM-Fallstricke" \
                "## 6. Concurrency & Lock-Hierarchie" \
                "## 7. Cross-Crate-Schnittstellen & DAG-Grenzen" \
                "## 8. Relevante ADRs & Rules"; do
                if ! grep -q "$section" "$file"; then
                  echo "❌ Sektion fehlt in $file: $section"
                  exit 1
                fi
              done
            fi
          done
          echo "✅ Alle AGENTS.md Dateien entsprechen dem 8-Sektionen-Template"
