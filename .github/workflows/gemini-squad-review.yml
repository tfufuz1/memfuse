# .github/workflows/gemini-squad-review.yml
name: Gemini Squad Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'jules/') # Nur Jules-PRs reviewen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Run AI Architect Review
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
          # Wir nutzen Account 'franz' als Lead-Architect für Reviews
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_FRANZ }}
        run: |
          # Differenz zum Main-Branch holen
          git diff origin/main...HEAD > pr_diff.txt
          
          # Gemini-Review Prompt
          gemini "Du bist der MemFuse Lead-Architekt. Analysiere diesen Diff gegen die Sovereign Core Doctrine (Zero-Panic, Async-Safety) und das AGENTS.md Protokoll. 
          Gibt es architektonische Bedenken? Antworte kurz und präzise.
          
          Diff:
          $(cat pr_diff.txt)" > review_comment.txt
          
          # Feedback als PR-Comment posten
          gh pr comment "${{ github.event.pull_request.number }}" --body "### 🤖 Gemini Squad Architect Review
          $(cat review_comment.txt)"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
