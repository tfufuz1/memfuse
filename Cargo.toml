[workspace]
resolver = "2"
members = [
    "crates/memfuse-core",
    "crates/memfuse-store",
    "crates/memfuse-index",
    "crates/memfuse-db",
    "crates/memfuse-text",
    "crates/memfuse-checkpoint",
    "crates/memfuse-crypto",
    "crates/memfuse-graph",
    "crates/memfuse-py",
    "crates/memfuse-tauri",
    "crates/memfuse-mcp",
    "crates/memfuse-ollama",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
# Error handling
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3.3"
flatbuffers = "24.3"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Data structures
bytes = "1"
memmap2 = "0.9.11"
ahash = "0.8"
itoa = "1"
parking_lot = "0.12"
roaring = "0.10"

# Crypto & hashing
blake3 = "1"
crc32fast = "1.3"

# Concurrency
rand = "0.8"

# Observability
tracing = "0.1"

# Testing
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates (Sovereign Core — 7 Crates)
memfuse-core = { path = "crates/memfuse-core" }
memfuse-store = { path = "crates/memfuse-store" }
memfuse-index = { path = "crates/memfuse-index" }
memfuse-db = { path = "crates/memfuse-db" }
memfuse-text = { path = "crates/memfuse-text" }
memfuse-checkpoint = { path = "crates/memfuse-checkpoint" }
memfuse-crypto = { path = "crates/memfuse-crypto" }
memfuse-graph = { path = "crates/memfuse-graph" }
memfuse-py    = { path = "crates/memfuse-py" }
memfuse-tauri = { path = "crates/memfuse-tauri" }
memfuse-mcp   = { path = "crates/memfuse-mcp" }
memfuse-ollama = { path = "crates/memfuse-ollama" }

# ── Archived Zone ──────────────────────────────────────────────────────────────
# memfuse-cluster, memfuse-sandbox, memfuse-saos-agent wurden in Phase 0 ausgelagert.
# memfuse-embed    → ONNX-Embeddings (wird via Feature-Flag optional)

# 🧊 Frozen Zone — external deps for future reactivation
# openraft = { version = "0.9", features = ["storage-v2", "serde"] }
# tonic = { version = "0.12", features = ["tls"] }
# prost = "0.13"
#
# Embedding & ML (activate with memfuse-embed feature)
# ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-24"] }
# hf-hub = { version = "0.3", default-features = false }
# tokenizers = "0.19"
# ndarray = "0.15"
#
# Network
# reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
