[workspace]
resolver = "2"
members = [
    "crates/memfuse-core",
    "crates/memfuse-store",
    "crates/memfuse-index",
    "crates/memfuse-db", "crates/memfuse-text", "crates/memfuse-runtime", "crates/memfuse-orchestrator", "crates/memfuse-py", "crates/memfuse-checkpoint",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
# Error handling
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2.0.0-rc.3", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async-stream = "0.3"
tokio-stream = "0.1"

# Data structures
bytes = "1"
memmap2 = "0.9"
ahash = "0.8"
parking_lot = "0.12"
roaring = "0.10"
unicode-segmentation = "1"

# Crypto & hashing
blake3 = "1"
crc32fast = "1.3"

# Concurrency
rand = "0.8"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
tempfile = "3"

# Internal crates
memfuse-core = { path = "crates/memfuse-core" }
memfuse-store = { path = "crates/memfuse-store" }
memfuse-index = { path = "crates/memfuse-index" }
memfuse-db = { path = "crates/memfuse-db" }
memfuse-text = { path = "crates/memfuse-text" }
memfuse-runtime = { path = "crates/memfuse-runtime" }
memfuse-orchestrator = { path = "crates/memfuse-orchestrator" }
memfuse-py = { path = "crates/memfuse-py" }
memfuse-checkpoint = { path = "crates/memfuse-checkpoint" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
