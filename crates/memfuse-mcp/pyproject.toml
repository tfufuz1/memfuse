[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memfuse-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) stdio server for MemFuse Brain"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "MemFuse Contributors" }
]
keywords = ["mcp", "model-context-protocol", "memfuse", "vector-database", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.scripts]
memfuse-mcp = "memfuse_mcp.server:main"
memfuse-mcp-server = "memfuse_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["python/memfuse_mcp"]
