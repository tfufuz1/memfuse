[package]
name = "memfuse-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
memfuse-db = { workspace = true }
memfuse-core = { workspace = true }
memfuse-ollama = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# NO Axum — MCP transport is stdio only (ADR-010). Adding HTTP here is an architecture violation.
# MCP stdio transport helpers (already transitively present via tokio)
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
async-trait = { workspace = true }
