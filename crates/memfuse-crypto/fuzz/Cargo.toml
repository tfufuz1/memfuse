[package]
name = "memfuse-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
bincode = "1.3"
memfuse-core = { path = "../../memfuse-core" }
memfuse-security = { path = ".." }

[[bin]]
name = "deletion_proof_tamper"
path = "fuzz_targets/deletion_proof_tamper.rs"
test = false
doc = false
