[package]
name = "memfuse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core types, traits, and error handling for MemFuse"

[features]
test-utils = []

[dependencies]
# Standard error derive macro for MemFuseError.
thiserror = { workspace = true }
# Bincode serialization error support.
bincode = { workspace = true }
# Serialization and deserialization framework for core types and stats.
serde = { workspace = true }
# JSON metadata representation and serialization in core traits and errors.
serde_json = { workspace = true }
# Thread synchronization primitives for in-memory structures (e.g., SnapshotRegistry, TxBuffer).
parking_lot = { workspace = true }
# High-performance hashing for internal collections and buffers.
ahash = { workspace = true }
# Async trait object support (desugars async trait methods for dyn-compatibility).
# Cryptographic hashing for deterministic key derivation (DocId/EntityId).
blake3 = { workspace = true }
# Cryptographic hash function SHA-256 for ConfigFingerprint.
sha2 = "0.10"
# Zero-copy IPC serialization support.
flatbuffers = { workspace = true }

[dev-dependencies]
# Async runtime for executing async unit tests.
tokio = { workspace = true, features = ["rt", "macros"] }
# Property-based testing framework for invariant validation.
proptest = "1.4"
