[package]
name = "memfuse-index"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HNSW vector index with SIMD distance computation for MemFuse"

[dependencies]
memfuse-core = { workspace = true }
memfuse-crypto = { workspace = true }
memfuse-graph = { path = "../memfuse-graph", optional = true }
subtle = "2.6"
ahash = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
roaring = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
memmap2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[features]
default = []
graph = ["dep:memfuse-graph"]
experimental-diskann = []
# ACHTUNG: physio-nucleation aktiviert F-02 (Partial HNSW Rebuild), das gegen ein
# dokumentiertes Architektur-Veto verstößt (siehe VETOES.md, falls vorhanden, sonst
# docs/decisions/ nach "Nucleation" durchsuchen). Der aktuelle rebuild_region()
# implementiert reines Tombstone-Pruning ohne Re-Wiring — Risiko: Grad-Verlust ohne
# Navigierbarkeits-Wiederherstellung. NICHT als default-Feature aktivieren bis
# test_nucleation_recall_regression() für > 30 Tage stabil grün ist UND ein ADR
# das ursprüngliche Veto explizit revidiert oder bestätigt einschränkt.
physio-nucleation = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
criterion = "0.5"
tempfile = "3"
proptest = "1.4"
bincode = { workspace = true }

[[bench]]
name = "distance_bench"
harness = false

[[bench]]
name = "sq8_bench"
harness = false

[[bench]]
name = "hnsw_bench"
harness = false

[[bench]]
name = "audit_benchmarks"
harness = false

[[test]]
name = "diskann_fault_injection_test"
required-features = ["experimental-diskann"]

[[test]]
name = "diskann_corruption_fallback_test"
required-features = ["experimental-diskann"]

[[test]]
name = "diskann_recall_test"
required-features = ["experimental-diskann"]

[[test]]
name = "mmap_toctou_test"
required-features = ["experimental-diskann"]

[[test]]
name = "quantize_persistence_audit"
required-features = ["experimental-diskann"]

[[test]]
name = "recall_audit"
required-features = ["experimental-diskann"]
