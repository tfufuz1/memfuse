[package]
name = "memfuse-index-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
memfuse-core = { path = "../../memfuse-core" }
memfuse-index = { path = ".." }

[[bin]]
name = "hnsw_insert_search"
path = "fuzz_targets/hnsw_insert_search.rs"
test = false
doc = false
