[package]
name = "memfuse-db"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MemFuse — Embedded hybrid-search for AI agents"

[dependencies]
memfuse-core = { workspace = true }
memfuse-store = { workspace = true }
memfuse-index = { workspace = true }
memfuse-text = { workspace = true }
memfuse-checkpoint = { workspace = true }
memfuse-embed = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
memfuse-sandbox = { path = "../memfuse-sandbox" }
memfuse-cluster = { workspace = true }
async-trait = { workspace = true }
tokio-util = { version = "0.7.18", features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }

[features]
bench = []

[[bench]]
name = "migration_benchmarks"
path = "../../benches/migration_benchmarks.rs"
harness = false
