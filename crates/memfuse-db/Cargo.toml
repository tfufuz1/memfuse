[package]
name = "memfuse-db"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MemFuse — Embedded hybrid-search for AI agents"

[dependencies]
memfuse-core = { workspace = true }
memfuse-store = { workspace = true }
memfuse-index = { workspace = true }
memfuse-text = { workspace = true }
memfuse-checkpoint = { workspace = true }
memfuse-graph = { workspace = true }
memfuse-embed = { workspace = true, optional = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { version = "0.7.18", features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
proptest = "1.4"
memfuse-index = { workspace = true, features = ["experimental-diskann"] }

[features]
default = []
bench = []
sandbox = []
cluster = []
experimental-diskann = ["memfuse-index/experimental-diskann"]
reranking = ["memfuse-embed/onnx"]

[[bench]]
name = "migration_benchmarks"
path = "../../benches/migration_benchmarks.rs"
harness = false

[[bench]]
name = "scale_bench"
path = "../../benches/scale_bench.rs"
harness = false

[[bench]]
name = "rrf_scale_bench"
path = "../../benches/rrf_scale_bench.rs"
harness = false

[[bench]]
name = "competitive_bench"
path = "../../benches/competitive_bench.rs"
harness = false

[[example]]
name = "quickstart"

[[example]]
name = "hybrid_search"

[[example]]
name = "collections"
