[package]
name = "memfuse-db"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MemFuse — Embedded hybrid-search for AI agents"

[dependencies]
memfuse-core = { workspace = true }
memfuse-store = { workspace = true }
memfuse-index = { workspace = true }
memfuse-text = { workspace = true }
memfuse-checkpoint = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { version = "0.7.18", features = ["rt"] }

# 🧊 Frozen Zone — uncomment to reactivate
memfuse-embed = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.4"

[features]
default = []
bench = []
# 🧊 Frozen features — stubs declared to silence cfg(feature) warnings.
# Uncomment dep: links above AND dep entries to fully reactivate.
embed = ["dep:memfuse-embed"]
sandbox = []
cluster = []

[[bench]]
name = "migration_benchmarks"
path = "../../benches/migration_benchmarks.rs"
harness = false

[[example]]
name = "quickstart"

[[example]]
name = "hybrid_search"

[[example]]
name = "collections"
