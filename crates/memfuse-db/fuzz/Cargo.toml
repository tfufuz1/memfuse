[package]
name = "memfuse-db-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
serde_json = "1"
memfuse-core = { path = "../../memfuse-core" }
memfuse-db = { path = ".." }

[[bin]]
name = "rrf_fusion"
path = "fuzz_targets/rrf_fusion.rs"
test = false
doc = false
