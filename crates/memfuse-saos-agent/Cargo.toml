[package]
name = "memfuse-saos-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Task and step orchestration (workflow engine) for MemFuse"

[dependencies]
memfuse-core = { workspace = true }
memfuse-db = { workspace = true }
memfuse-graph = { workspace = true }
memfuse-checkpoint = { workspace = true }
memfuse-store = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

[dev-dependencies]
memfuse-sandbox = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
