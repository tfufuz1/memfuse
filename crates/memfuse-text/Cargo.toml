[package]
name = "memfuse-text"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MemFuse — Text processing and BM25 search for Hybrid Search"

[dependencies]
memfuse-core = { workspace = true }
itoa = { workspace = true }
# ANCHOR:ARCH:DAG-001 — Architektur-Layer durchbrochen
# WP:NONE PRIO:1 NEEDS:NONE
# AGENT:05 DATE:2026-05-16 STATUS:FIXME
# CREATED:2026-05-09 DEADLINE:NONE
# VERLETZUNG: memfuse-text importiert memfuse-store gegen die DAG-Invariante
# IMPACT: Verstößt gegen Layer-Architektur, verhindert saubere Kompilierung
# SOFORTIGE AKTION: Abhängigkeit extrahieren nach memfuse-core oder neuen Crate
unicode-segmentation = "1.11.0"
ahash = { workspace = true }
async-trait = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
memfuse-store = { workspace = true }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "text_bench"
harness = false
