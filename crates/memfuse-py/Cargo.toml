[package]
name = "memfuse-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Python bindings for MemFuse using PyO3"

[lib]
name = "memfuse"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24.1", features = ["extension-module", "abi3-py38"] }
numpy = "0.24"
tokio = { version = "1", features = ["full"] }
# ANCHOR:ARCH:DAG-003 — Architektur-Layer durchbrochen (Ausnahme für Bindings)
# WP:NONE PRIO:2 NEEDS:NONE
# AGENT:06 DATE:2026-05-09 STATUS:DONE
# VERLETZUNG: memfuse-py importiert memfuse-db gegen die DAG-Invariante.
# RECHTFERTIGUNG: Als High-Level Python-Bridge (Layer 3) benötigt memfuse-py Zugriff
# auf die orchestrating Facade in memfuse-db. Dies ist eine beabsichtigte Ausnahme
# vom Sovereign Core DAG, da Bindings per Definition an der Grenze zum Nutzer stehen.
memfuse-db = { workspace = true }
serde_json = { workspace = true }
pythonize = "0.24"
