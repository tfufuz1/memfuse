[package]
name = "memfuse-py"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
description = "Python bindings for MemFuse using PyO3"

[lib]
name = "_memfuse"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pyo3 = { version = "0.24.1", features = ["extension-module", "abi3-py38", "multiple-pymethods"] }
numpy = "0.24"
tokio = { version = "1", features = ["full"] }
# ANCHOR:ARCH:DAG-003 — Architektur-Layer durchbrochen (Ausnahme für Bindings)
# WP:NONE PRIO:2 NEEDS:NONE
# AGENT:06 DATE:2026-05-09 STATUS:DONE
# VERLETZUNG: memfuse-py importiert memfuse-db gegen die DAG-Invariante.
# RECHTFERTIGUNG: Als High-Level Python-Bridge (Layer 3) benötigt memfuse-py Zugriff
# auf die orchestrating Facade in memfuse-db. Dies ist eine beabsichtigte Ausnahme
# vom Sovereign Core DAG, da Bindings per Definition an der Grenze zum Nutzer stehen.
memfuse-core = { path = "../memfuse-core" }
memfuse-db = { path = "../memfuse-db" }
flatbuffers = "24.3"
serde_json = "1"
pythonize = "0.24"

[features]
default = []

[workspace]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
overflow-checks = true
