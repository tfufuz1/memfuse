[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "memfuse"
requires-python = ">=3.9"
description = "Embedded Hybrid-Search vector database"
version = "0.1.0"
dependencies = [
    "numpy>=1.20"
]

[project.optional-dependencies]
test = ["pytest", "numpy"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "memfuse"
